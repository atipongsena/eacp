# DEVELOPMENT ONLY: the dependencies protect themselves, mirroring the compose
# networks (core, bus, erp): PostgreSQL only from EACP pods, NATS only from the
# API and the worker, the fakes only from the worker.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-ingress, namespace: eacp-deps}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: postgres, namespace: eacp-deps}
spec:
  podSelector: {matchLabels: {app: postgres}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: eacp}}
          podSelector:
            matchExpressions:
              - {key: app.kubernetes.io/component, operator: In, values: [api, worker, migrate]}
      ports: [{protocol: TCP, port: 5432}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: nats, namespace: eacp-deps}
spec:
  podSelector: {matchLabels: {app: nats}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: eacp}}
          podSelector:
            matchExpressions:
              - {key: app.kubernetes.io/component, operator: In, values: [api, worker]}
      ports: [{protocol: TCP, port: 4222}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: fakes, namespace: eacp-deps}
spec:
  podSelector:
    matchExpressions:
      - {key: app, operator: In, values: [fakeerp, fakemcp]}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: eacp}}
          podSelector: {matchLabels: {app.kubernetes.io/component: worker}}
      ports:
        - {protocol: TCP, port: 8090}
        - {protocol: TCP, port: 8091}
