# DEVELOPMENT ONLY: the stand-in agent runtime (compose service "agent"). It
# holds no credential; the network lets it reach only the API.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: agents
spec:
  replicas: 1
  selector:
    matchLabels: {app: agent}
  template:
    metadata:
      labels: {app: agent}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {node-role.kubernetes.io/control-plane: ""} # the node the disruption test never drains
      securityContext: {runAsNonRoot: true, runAsUser: 65534, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: agent
          image: busybox:1.37
          imagePullPolicy: Never
          command: [sleep, infinity]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
