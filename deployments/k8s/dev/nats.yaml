# DEVELOPMENT ONLY: NATS JetStream with the compose users (ConfigMap nats-config
# from deployments/docker/nats/nats.conf). Signals only (ADR-014).
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: eacp-deps
spec:
  selector: {app: nats}
  ports: [{name: client, port: 4222, targetPort: 4222}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  namespace: eacp-deps
spec:
  replicas: 1
  selector:
    matchLabels: {app: nats}
  template:
    metadata:
      labels: {app: nats}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {node-role.kubernetes.io/control-plane: ""} # the node the disruption test never drains
      containers:
        - name: nats
          image: nats:2.15.0-alpine
          imagePullPolicy: Never
          command: [nats-server, --config, /etc/nats/nats.conf]
          ports: [{containerPort: 4222}, {containerPort: 8222}]
          readinessProbe:
            httpGet: {path: /healthz, port: 8222}
            periodSeconds: 2
          volumeMounts:
            - {name: config, mountPath: /etc/nats, readOnly: true}
            - {name: data, mountPath: /data}
      volumes:
        - name: config
          configMap: {name: nats-config}
        - {name: data, emptyDir: {}}
