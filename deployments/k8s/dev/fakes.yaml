# DEVELOPMENT ONLY: the Fake ERP and Fake MCP of the demos. Only the worker
# may reach them (policies.yaml); they hold just their verifier tokens.
apiVersion: v1
kind: Service
metadata:
  name: fakeerp
  namespace: eacp-deps
spec:
  selector: {app: fakeerp}
  ports: [{name: http, port: 8090, targetPort: 8090}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fakeerp
  namespace: eacp-deps
spec:
  replicas: 1
  selector:
    matchLabels: {app: fakeerp}
  template:
    metadata:
      labels: {app: fakeerp}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {node-role.kubernetes.io/control-plane: ""} # the node the disruption test never drains
      securityContext: {runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: fakeerp
          image: eacp:dev
          imagePullPolicy: Never
          command: [/fakeerp]
          env:
            - {name: EACP_ENV, value: development}
            - {name: EACP_LOG_FORMAT, value: json}
            - {name: EACP_HTTP_ADDR, value: ":8090"}
            - {name: EACP_FAKEERP_TOKEN_FILE, value: /run/secrets/fakeerp/token}
            - {name: EACP_FAKEERP_DATA_FILE, value: /data/operations.jsonl}
            # ADR-019: the JIT demo's token endpoint (docs/DEMO.md)
            - {name: EACP_FAKEERP_OAUTH_CLIENT_ID, value: eacp-worker}
            - {name: EACP_FAKEERP_OAUTH_CLIENT_SECRET_FILE, value: /run/secrets/fakeerp-oauth/secret}
            - {name: EACP_FAKEERP_OAUTH_TTL, value: 300s}
            # ADR-019 Rev 1.1: a federated client that trusts the cluster's
            # service-account issuer (scripts/k8s-e2e.sh writes the ConfigMap)
            - {name: EACP_FAKEERP_OAUTH_FEDERATED_CLIENT_ID, value: eacp-worker-wif}
            - name: EACP_FAKEERP_OAUTH_FEDERATED_ISSUER
              valueFrom: {configMapKeyRef: {name: fakeerp-federation, key: issuer}}
            - {name: EACP_FAKEERP_OAUTH_FEDERATED_AUDIENCE, value: fakeerp}
            - {name: EACP_FAKEERP_OAUTH_FEDERATED_SUBJECT, value: "system:serviceaccount:eacp:eacp-worker"}
            - {name: EACP_FAKEERP_OAUTH_FEDERATED_JWKS_FILE, value: /run/config/fakeerp-federation/jwks.json}
            # ADR-019 Rev 1.2: a private_key_jwt client with the dev key's JWKS
            - {name: EACP_FAKEERP_OAUTH_KEY_CLIENT_ID, value: eacp-worker-pkjwt}
            - {name: EACP_FAKEERP_OAUTH_KEY_AUDIENCE, value: "http://fakeerp:8090/oauth/token"}
            - {name: EACP_FAKEERP_OAUTH_KEY_JWKS_FILE, value: /run/config/fakeerp-federation/client-jwks.json}
          ports: [{containerPort: 8090}]
          readinessProbe:
            httpGet: {path: /healthz, port: 8090}
            periodSeconds: 2
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: token, mountPath: /run/secrets/fakeerp, readOnly: true}
            - {name: oauth-client, mountPath: /run/secrets/fakeerp-oauth, readOnly: true}
            - {name: federation, mountPath: /run/config/fakeerp-federation, readOnly: true}
            - {name: data, mountPath: /data}
      volumes:
        - name: token
          secret: {secretName: fakeerp-token}
        - name: oauth-client
          secret: {secretName: fakeerp-oauth-client}
        - name: federation
          configMap: {name: fakeerp-federation, items: [{key: jwks.json, path: jwks.json}, {key: client-jwks.json, path: client-jwks.json}]}
        - {name: data, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: fakemcp
  namespace: eacp-deps
spec:
  selector: {app: fakemcp}
  ports: [{name: http, port: 8091, targetPort: 8091}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fakemcp
  namespace: eacp-deps
spec:
  replicas: 1
  selector:
    matchLabels: {app: fakemcp}
  template:
    metadata:
      labels: {app: fakemcp}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {node-role.kubernetes.io/control-plane: ""} # the node the disruption test never drains
      securityContext: {runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: fakemcp
          image: eacp:dev
          imagePullPolicy: Never
          command: [/fakemcp]
          env:
            - {name: EACP_ENV, value: development}
            - {name: EACP_LOG_FORMAT, value: json}
            - {name: EACP_HTTP_ADDR, value: ":8091"}
            - {name: EACP_FAKEMCP_TOKEN_FILE, value: /run/secrets/fakemcp/token}
            - {name: EACP_FAKEMCP_TOOLS_FILE, value: /data/tools.json}
          ports: [{containerPort: 8091}]
          readinessProbe:
            httpGet: {path: /healthz, port: 8091}
            periodSeconds: 2
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: token, mountPath: /run/secrets/fakemcp, readOnly: true}
            - {name: data, mountPath: /data}
      volumes:
        - name: token
          secret: {secretName: fakemcp-token}
        - {name: data, emptyDir: {}}
