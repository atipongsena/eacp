{{- if .Values.llmGateway.enabled -}}
{{- $c := dict "root" . "component" "llm-gateway" -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-llm-gateway
  labels:
    {{- include "eacp.labels" $c | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-llm-gateway
  labels:
    {{- include "eacp.labels" $c | nindent 4 }}
spec:
  replicas: {{ .Values.llmGateway.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      {{- include "eacp.selector" $c | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "eacp.labels" $c | nindent 8 }}
    spec:
      {{- include "eacp.podSecurity" (dict "root" . "sa" true "gateway" true) | nindent 6 }}
      terminationGracePeriodSeconds: {{ .Values.llmGateway.terminationGracePeriodSeconds }}
      {{- include "eacp.spread" $c | nindent 6 }}
      {{- include "eacp.goDNS" . | nindent 6 }}
      containers:
        - name: llm-gateway
          image: {{ include "eacp.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/llm-gateway"]
          ports:
            - {name: http, containerPort: 8083}
          env:
            - {name: EACP_HTTP_ADDR, value: ":8083"}
            - {name: EACP_LOG_FORMAT, value: json}
            - name: EACP_DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ .Values.database.appSecret }}, key: url}}
            - {name: EACP_GOVERNANCE_PROVIDER, value: {{ .Values.governance.provider | quote }}}
            - {name: EACP_AGT_PDP_URL, value: "https://{{ .Release.Name }}-pdp:8443"}
            - {name: EACP_AGT_PDP_CA_FILE, value: /pki/ca.pem}
            - {name: EACP_AGT_PDP_CERT_FILE, value: /pki/client.pem}
            - {name: EACP_AGT_PDP_KEY_FILE, value: /pki/client-key.pem}
            - {name: EACP_ENV, value: {{ .Values.environment | quote }}}
            - {name: EACP_LLM_SECRETS_FILE, value: /run/secrets/eacp-llm/provider-secrets.json}
            {{- include "eacp.shutdownEnv" . | nindent 12 }}
            {{- include "eacp.extraEnv" .Values.llmGateway.env | nindent 12 }}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5, failureThreshold: 2}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10, failureThreshold: 3}
          startupProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 2, failureThreshold: 60}
          resources:
            {{- toYaml .Values.llmGateway.resources | nindent 12 }}
          {{- include "eacp.containerSecurity" . | nindent 10 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            {{- include "eacp.caMounts" (dict "root" . "nats" false) | nindent 12 }}
            - {name: pki, mountPath: /pki, readOnly: true}
            - {name: providers, mountPath: /run/secrets/eacp-llm, readOnly: true}
      volumes:
        - {name: tmp, emptyDir: {}}
        {{- include "eacp.caVolumes" (dict "root" . "nats" false) | nindent 8 }}
        - name: providers
          secret:
            secretName: {{ .Values.llmGateway.providerSecret }}
            items: [{key: provider-secrets.json, path: provider-secrets.json}]
        - name: pki
          projected:
            sources:
              - secret:
                  name: {{ .Values.pdp.tlsSecret }}
                  items:
                    - {key: ca.pem, path: ca.pem}
                    - {key: client.pem, path: client.pem}
                    - {key: client-key.pem, path: client-key.pem}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-llm-gateway
  labels:
    {{- include "eacp.labels" $c | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "eacp.selector" $c | nindent 4 }}
  ports:
    - {name: http, port: 8083, targetPort: http}

{{- end }}
