{{- /* Fail closed on dangerous or incomplete values (ADR-029 Rev 1.1). Renders nothing. */ -}}
{{- $v := .Values -}}
{{- range $name := list "database.appSecret" "database.ownerSecret" "pdp.tlsSecret" "worker.connectorSecrets" -}}
{{- $parts := splitList "." $name -}}
{{- $val := index (index $v (first $parts)) (last $parts) -}}
{{- if not $val -}}{{- fail (printf "%s must name an existing Secret" $name) -}}{{- end -}}
{{- end -}}
{{- if $v.nats.enabled -}}
{{- if or (not $v.nats.relaySecret) (not $v.nats.workerSecret) -}}{{- fail "nats.relaySecret and nats.workerSecret must name existing Secrets (or set nats.enabled=false)" -}}{{- end -}}
{{- end -}}
{{- if not (has $v.environment (list "development" "test" "staging" "production")) -}}{{- fail "environment must be one of development, test, staging, production" -}}{{- end -}}
{{- $reserved := list "EACP_HTTP_ADDR" "EACP_LOG_FORMAT" "EACP_ENV" "EACP_WORKER_ID" "EACP_GOVERNANCE_PROVIDER" "EACP_NATS_URL" "EACP_NATS_CA_FILE" "EACP_SHUTDOWN_DELAY" "EACP_SHUTDOWN_TIMEOUT" -}}
{{- range $c := list "api" "worker" "pdp" -}}
{{- $comp := index $v $c -}}
{{- if lt (int $comp.replicas) 1 -}}{{- fail (printf "%s.replicas must be at least 1" $c) -}}{{- end -}}
{{- range $k, $val := $comp.env -}}
{{- if eq $k "EACP_CONNECTOR_SECRETS_FILE" -}}{{- fail (printf "%s.env: connector secrets belong to the worker's connectorSecrets only (ADR-001)" $c) -}}{{- end -}}
{{- if eq $k "EACP_DATABASE_URL" -}}{{- fail (printf "%s.env: EACP_DATABASE_URL comes from database.appSecret, never from values" $c) -}}{{- end -}}
{{- if or (has $k $reserved) (hasPrefix "EACP_AGT_PDP_" $k) (hasPrefix "AGT_PDP_" $k) -}}{{- fail (printf "%s.env.%s is set by the chart; use its value instead" $c $k) -}}{{- end -}}
{{- if or (kindIs "map" $val) (kindIs "slice" $val) -}}{{- fail (printf "%s.env.%s must be a string" $c $k) -}}{{- end -}}
{{- if regexMatch "://[^/?#]*@" (toString $val) -}}{{- fail (printf "%s.env.%s: a URL with credentials (user or password) belongs in a Secret" $c $k) -}}{{- end -}}
{{- end -}}
{{- end -}}
{{- if not (has $v.governance.provider (list "microsoft-agt" "local")) -}}{{- fail "governance.provider must be microsoft-agt or local" -}}{{- end -}}
{{- if and (eq $v.governance.provider "local") (not $v.governance.allowLocal) -}}{{- fail "governance.provider=local needs governance.allowLocal=true (tests only)" -}}{{- end -}}
{{- if not (regexMatch "^[0-9]+s$" (toString $v.shutdown.delay)) -}}{{- fail "shutdown.delay must be whole seconds from 0s to 60s, like 10s" -}}{{- end -}}
{{- if not (regexMatch "^[1-9][0-9]*s$" (toString $v.shutdown.timeout)) -}}{{- fail "shutdown.timeout must be positive whole seconds, like 15s" -}}{{- end -}}
{{- $call := $v.worker.maxCallSeconds -}}
{{- if not (or (kindIs "int" $call) (kindIs "int64" $call) (kindIs "float64" $call)) -}}{{- fail "worker.maxCallSeconds must be a whole number of seconds, at least 1" -}}{{- end -}}
{{- if or (lt (float64 $call) 1.0) (ne (float64 $call) (float64 (int $call))) -}}{{- fail "worker.maxCallSeconds must be a whole number of seconds, at least 1" -}}{{- end -}}
{{- $delay := int (include "eacp.seconds" $v.shutdown.delay) -}}
{{- if gt $delay 60 -}}{{- fail "shutdown.delay must be whole seconds from 0s to 60s, like 10s" -}}{{- end -}}
{{- $timeout := int (include "eacp.seconds" $v.shutdown.timeout) -}}
{{- if lt (int $v.api.terminationGracePeriodSeconds) (add $delay $timeout) -}}{{- fail (printf "api.terminationGracePeriodSeconds must be at least shutdown.delay + shutdown.timeout (%d)" (add $delay $timeout)) -}}{{- end -}}
{{- if lt (int $v.pdp.terminationGracePeriodSeconds) (add $delay $timeout) -}}{{- fail (printf "pdp.terminationGracePeriodSeconds must be at least shutdown.delay + shutdown.timeout (%d)" (add $delay $timeout)) -}}{{- end -}}
{{- if lt (int $v.worker.terminationGracePeriodSeconds) (add $delay $timeout (int $v.worker.maxCallSeconds)) -}}{{- fail (printf "worker.terminationGracePeriodSeconds must be at least shutdown.delay + shutdown.timeout + worker.maxCallSeconds (%d)" (add $delay $timeout (int $v.worker.maxCallSeconds))) -}}{{- end -}}
{{- if and (not $v.worker.connectorEgress) (not $v.worker.allowNoConnectorEgress) -}}{{- fail "worker.connectorEgress is empty: list the enterprise systems the worker may reach, or set worker.allowNoConnectorEgress=true" -}}{{- end -}}
{{- $wi := $v.worker.workloadIdentity -}}
{{- if $wi.enabled -}}
{{- if or (not $wi.audience) (regexMatch "[[:space:]]" (toString $wi.audience)) (gt (len (toString $wi.audience)) 256) -}}{{- fail "worker.workloadIdentity.audience must be 1-256 characters without whitespace when workload identity is enabled" -}}{{- end -}}
{{- end -}}
{{- $exp := $wi.expirationSeconds -}}
{{- if not (or (kindIs "int" $exp) (kindIs "int64" $exp) (kindIs "float64" $exp)) -}}{{- fail "worker.workloadIdentity.expirationSeconds must be whole seconds from 600 to 86400" -}}{{- end -}}
{{- if or (lt (float64 $exp) 600.0) (gt (float64 $exp) 86400.0) (ne (float64 $exp) (float64 (int $exp))) -}}{{- fail "worker.workloadIdentity.expirationSeconds must be whole seconds from 600 to 86400" -}}{{- end -}}
{{- $vi := $v.worker.vaultIdentity -}}
{{- if $vi.enabled -}}
{{- if or (not $vi.audience) (regexMatch "[[:space:]]" (toString $vi.audience)) (gt (len (toString $vi.audience)) 256) -}}{{- fail "worker.vaultIdentity.audience must be 1-256 characters without whitespace when the Vault identity is enabled" -}}{{- end -}}
{{- end -}}
{{- $vexp := $vi.expirationSeconds -}}
{{- if not (or (kindIs "int" $vexp) (kindIs "int64" $vexp) (kindIs "float64" $vexp)) -}}{{- fail "worker.vaultIdentity.expirationSeconds must be whole seconds from 600 to 86400" -}}{{- end -}}
{{- if or (lt (float64 $vexp) 600.0) (gt (float64 $vexp) 86400.0) (ne (float64 $vexp) (float64 (int $vexp))) -}}{{- fail "worker.vaultIdentity.expirationSeconds must be whole seconds from 600 to 86400" -}}{{- end -}}
{{- if and $v.worker.spiffe.enabled (or (not $v.worker.spiffe.csiDriver) (regexMatch "[[:space:]]" (toString $v.worker.spiffe.csiDriver))) -}}{{- fail "worker.spiffe.csiDriver must name the SPIFFE CSI driver when worker.spiffe is enabled" -}}{{- end -}}
{{- if $v.studio.enabled -}}
{{- if or (not $v.studio.masterSecret) (not $v.studio.runtimeKeySecret) -}}{{- fail "studio.masterSecret and studio.runtimeKeySecret must name existing Secrets when studio is enabled" -}}{{- end -}}
{{- if not (regexMatch "^v[0-9]{1,4}$" (toString $v.studio.masterVersion)) -}}{{- fail "studio.masterVersion must be v followed by 1 to 4 digits, like v1" -}}{{- end -}}
{{- if lt (int $v.studio.replicas) 1 -}}{{- fail "studio.replicas must be at least 1" -}}{{- end -}}
{{- if lt (int $v.studio.terminationGracePeriodSeconds) (add $delay $timeout) -}}{{- fail (printf "studio.terminationGracePeriodSeconds must be at least shutdown.delay + shutdown.timeout (%d)" (add $delay $timeout)) -}}{{- end -}}
{{- $runtimeReserved := list "EACP_API_URL" "EACP_STUDIO_MASTER_FILE" "EACP_STUDIO_MASTER_VERSION" "EACP_RUNTIME_KEY_FILE" -}}
{{- range $k, $val := $v.studio.env -}}
{{- if or (eq $k "EACP_DATABASE_URL") (hasSuffix "SECRETS_FILE" $k) -}}{{- fail (printf "studio.env.%s: agent-runtime holds no database, connector or provider secret (ADR-033)" $k) -}}{{- end -}}
{{- if or (has $k $reserved) (has $k $runtimeReserved) -}}{{- fail (printf "studio.env.%s is set by the chart; use its value instead" $k) -}}{{- end -}}
{{- if or (kindIs "map" $val) (kindIs "slice" $val) -}}{{- fail (printf "studio.env.%s must be a string" $k) -}}{{- end -}}
{{- if regexMatch "://[^/?#]*@" (toString $val) -}}{{- fail (printf "studio.env.%s: a URL with credentials belongs in a Secret" $k) -}}{{- end -}}
{{- end -}}
{{- end -}}
{{- if not $v.database.peers -}}{{- fail "database.peers must select PostgreSQL for NetworkPolicy egress" -}}{{- end -}}
{{- if and $v.nats.enabled (not $v.nats.peers) -}}{{- fail "nats.peers must select NATS for NetworkPolicy egress (or set nats.enabled=false)" -}}{{- end -}}
