apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "eacp.labels" (dict "root" . "component" "serviceaccount") | nindent 4 }}
automountServiceAccountToken: false
---
# The worker's own identity: a federated subject
# system:serviceaccount:<namespace>:<release>-worker names only the worker
# (ADR-019 Rev 1.1).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-worker
  labels:
    {{- include "eacp.labels" (dict "root" . "component" "worker") | nindent 4 }}
automountServiceAccountToken: false
