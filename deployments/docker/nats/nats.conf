# NATS JetStream for EACP signals (ADR-014). LOCAL-DEVELOPMENT credentials.
#
# NATS carries work hints and dashboard events only; PostgreSQL is the
# execution authority. Each EACP role gets the narrowest permissions:
#
#   relay  (controlplane-api)  publishes hints and events; owns the topology
#   worker (execution-worker)  reads and acknowledges its own consumer and
#                              hears kill signals; it cannot forge a hint or
#                              an event
#
# Production uses TLS (tls:// URLs, EACP_NATS_CA_FILE) and its own secrets;
# a dashboard gets a credential scoped to eacp.events.<tenant>.> (ADR-014 §4).

listen: 0.0.0.0:4222
http: 0.0.0.0:8222 # monitoring and /healthz, on the internal bus network only
server_name: eacp-nats

jetstream {
  store_dir: /data
  max_file_store: 2GB
  max_memory_store: 64MB
}

authorization {
  users: [
    {
      user: relay
      password: relay_dev
      permissions: {
        publish: { allow: ["eacp.work.>", "eacp.events.>", "$JS.API.>"] }
        subscribe: { allow: ["_INBOX.>"] }
      }
    }
    {
      user: worker
      password: worker_dev
      permissions: {
        publish: {
          allow: [
            "$JS.API.CONSUMER.INFO.EACP_WORK.execution-worker",
            "$JS.API.CONSUMER.MSG.NEXT.EACP_WORK.execution-worker",
            "$JS.ACK.EACP_WORK.execution-worker.>"
          ]
        }
        # Kill signals only wake PostgreSQL checks (ADR-016); no other event.
        subscribe: { allow: ["_INBOX.>", "eacp.events.*.kill.changed"] }
      }
    }
  ]
}
