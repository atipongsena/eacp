version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /sidecars/agt-pdp
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories:
      - /deployments/docker
