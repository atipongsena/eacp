# EACP local environment (Slice A, and Slice B: the AGT sidecar PDP and NATS).
#
# Network topology enforces the control-plane boundary (ADR-001 §3, §3a):
#
#   agents : agent runtimes + controlplane-api        (agents can reach only the API)
#   core   : controlplane-api + execution-worker + postgres
#   erp    : execution-worker + fakeerp + fakemcp     (only the worker reaches the ERP and the MCP server)
#   pdp    : controlplane-api + agt-pdp               (only the API asks the PDP; mutual TLS)
#   bus    : controlplane-api + execution-worker + nats (work hints and events; no agent)
#   vault  : execution-worker + vault + vault-init     (only the worker reads credentials from Vault)
#
# Governance decisions come from the Microsoft AGT/ACS sidecar PDP (ADR-002
# §8). pdp-pki writes a DEVELOPMENT-ONLY mutual-TLS PKI into the pdp_pki
# volume, shared read-only by the API (client certificate) and the sidecar
# (server certificate); production issues these from its own CA.
#
# The "agent" service stands in for an agent runtime. It has no route to
# fakeerp and holds no ERP credential. The connector-secret manifest is
# mounted into execution-worker only; Fake ERP receives just its verifier
# token. Every other service refuses EACP_CONNECTOR_SECRETS_FILE. The
# worker's private_key_jwt signing key (client_key) is likewise the worker's
# only; Fake ERP gets its public JWKS (client_jwks).
#
# A DEVELOPMENT-ONLY Vault (dev mode, in memory, a fixed root token) holds
# the Vault demo's credentials (ADR-019 Rev 1.3). vault-init writes them and
# the worker's AppRole login into vault_approle, which only the worker mounts.
# Vault's data does not survive a restart of the vault service; run
# `docker compose up -d --force-recreate vault vault-init` to restore it.
#
# NATS JetStream carries signals only (ADR-014): the API's outbox relay
# publishes work hints and dashboard events, and a hint wakes the worker's
# PostgreSQL claim loop. Each role has its own NATS user; the worker's cannot
# publish. With NATS stopped, everything still works (workers poll).
# Credentials below are local-development defaults only.

name: eacp

x-eacp-env: &eacp-env
  EACP_ENV: development
  EACP_LOG_FORMAT: json
  EACP_OTEL_EXPORTER: none

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      EACP_OWNER_PASSWORD: eacp_owner_dev
      EACP_APP_PASSWORD: eacp_app_dev
    ports:
      - "127.0.0.1:55432:5432" # host access for integration tests (EACP_TEST_ADMIN_DSN)
    volumes:
      - ./deployments/docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eacp"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [core]

  migrate:
    build: { context: ., dockerfile: deployments/docker/Dockerfile }
    command: ["/eacpctl", "migrate", "up"]
    environment:
      <<: *eacp-env
      EACP_DATABASE_URL: postgres://eacp_owner:eacp_owner_dev@postgres:5432/eacp?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }
    networks: [core]

  controlplane-api:
    build: { context: ., dockerfile: deployments/docker/Dockerfile }
    command: ["/controlplane-api"]
    restart: on-failure # startup fails closed (e.g. database unreachable); the supervisor retries
    environment:
      <<: *eacp-env
      EACP_HTTP_ADDR: ":8080"
      EACP_DATABASE_URL: postgres://eacp_app:eacp_app_dev@postgres:5432/eacp?sslmode=disable
      EACP_GOVERNANCE_PROVIDER: microsoft-agt
      EACP_AGT_PDP_URL: https://agt-pdp:8443
      EACP_AGT_PDP_CA_FILE: /pki/ca.pem
      EACP_AGT_PDP_CERT_FILE: /pki/client.pem
      EACP_AGT_PDP_KEY_FILE: /pki/client-key.pem
      EACP_NATS_URL: nats://relay:relay_dev@nats:4222
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - pdp_pki:/pki:ro
    depends_on:
      migrate: { condition: service_completed_successfully }
      pdp-pki: { condition: service_completed_successfully }
    networks: [agents, core, pdp, bus]

  # Development-only mutual-TLS PKI for the PDP link (kept if present).
  pdp-pki:
    build: { context: ., dockerfile: deployments/docker/Dockerfile }
    command: ["/eacpctl", "pdp-dev-certs", "--dir", "/pki", "--name", "agt-pdp"]
    environment:
      <<: *eacp-env
    volumes:
      - pdp_pki:/pki
    network_mode: none

  # Development-only private_key_jwt client key (ADR-019 Rev 1.2, kept if
  # present): the key and certificate go to client_key, which only the worker
  # mounts; the public JWKS goes to client_jwks, which only Fake ERP mounts.
  client-key:
    build: { context: ., dockerfile: deployments/docker/Dockerfile }
    command: ["/eacpctl", "dev-client-key", "--dir", "/client-key", "--jwks", "/client-jwks/jwks.json"]
    environment:
      <<: *eacp-env
    volumes:
      - client_key:/client-key
      - client_jwks:/client-jwks
    network_mode: none

  # Microsoft AGT policy layer + ACS engine + OPA, pinned (sidecars/agt-pdp).
  # Stateless; reachable only from controlplane-api, only with a client
  # certificate. Its outage keeps new actions RECEIVED (ADR-002 §6).
  agt-pdp:
    build: { context: ., dockerfile: sidecars/agt-pdp/Dockerfile }
    restart: on-failure
    environment:
      AGT_PDP_LISTEN: "0.0.0.0:8443"
      AGT_PDP_INSTANCE_ID: agt-pdp-1
      AGT_PDP_TLS_CERT_FILE: /pki/server.pem
      AGT_PDP_TLS_KEY_FILE: /pki/server-key.pem
      AGT_PDP_TLS_CLIENT_CA_FILE: /pki/ca.pem
    volumes:
      - pdp_pki:/pki:ro
    depends_on:
      pdp-pki: { condition: service_completed_successfully }
    networks: [pdp]

  execution-worker:
    build: { context: ., dockerfile: deployments/docker/Dockerfile }
    command: ["/execution-worker"]
    restart: on-failure # startup fails closed (e.g. database unreachable); the supervisor retries
    environment:
      <<: *eacp-env
      EACP_HTTP_ADDR: ":8081"
      EACP_DATABASE_URL: postgres://eacp_app:eacp_app_dev@postgres:5432/eacp?sslmode=disable
      EACP_WORKER_ID: execution-worker-1
      EACP_CONNECTOR_SECRETS_FILE: /run/secrets/connector_secrets
      EACP_NATS_URL: nats://worker:worker_dev@nats:4222
    secrets: [connector_secrets, fakeerp_token]
    volumes:
      - client_key:/run/secrets/eacp-client-key:ro
      - vault_approle:/run/secrets/eacp-vault-approle:ro
    depends_on:
      migrate: { condition: service_completed_successfully }
      client-key: { condition: service_completed_successfully }
      vault-init: { condition: service_completed_successfully }
    networks: [core, erp, bus, vault]

  # DEVELOPMENT ONLY: Vault in dev mode (in memory, unsealed, a fixed root
  # token). KV v2 is mounted at secret/. Reachable only on the vault network.
  vault:
    image: hashicorp/vault:2.1.1
    command: ["server", "-dev", "-dev-root-token-id=dev-only-vault-root-token", "-dev-listen-address=0.0.0.0:8200"]
    restart: on-failure
    environment:
      SKIP_SETCAP: "true" # dev mode does not lock memory
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [vault]

  # One-shot: AppRole, the worker's read-only policy, the demo's KV values
  # and the worker's role_id/secret_id (deployments/docker/vault/init.sh).
  vault-init:
    image: hashicorp/vault:2.1.1
    entrypoint: ["/bin/sh", "/init.sh"]
    user: "0" # writes the login files for the worker's uid into a fresh volume
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: dev-only-vault-root-token
    secrets: [fakeerp_token, fakeerp_oauth_client]
    volumes:
      - ./deployments/docker/vault/init.sh:/init.sh:ro
      - vault_approle:/approle
    depends_on:
      vault: { condition: service_healthy }
    networks: [vault]

  # NATS JetStream for work hints and dashboard events (ADR-014). Not a
  # dependency of any service: they start, and stay correct, without it.
  nats:
    image: nats:2.15.0-alpine
    command: ["nats-server", "--config", "/etc/nats/nats.conf"]
    restart: on-failure
    volumes:
      - ./deployments/docker/nats/nats.conf:/etc/nats/nats.conf:ro
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [bus]

  fakeerp:
    build: { context: ., dockerfile: deployments/docker/Dockerfile }
    command: ["/fakeerp"]
    restart: on-failure # startup fails closed (e.g. database unreachable); the supervisor retries
    environment:
      <<: *eacp-env
      EACP_HTTP_ADDR: ":8090"
      EACP_FAKEERP_TOKEN_FILE: /run/secrets/fakeerp_token
      EACP_FAKEERP_DATA_FILE: /tmp/operations.jsonl
      # ADR-019: a token endpoint for the JIT demo (docs/DEMO.md). 300s so a
      # token outlives the default 30s call plus the worker's 30s skew.
      EACP_FAKEERP_OAUTH_CLIENT_ID: eacp-worker
      EACP_FAKEERP_OAUTH_CLIENT_SECRET_FILE: /run/secrets/fakeerp_oauth_client
      EACP_FAKEERP_OAUTH_TTL: 300s
      # ADR-019 Rev 1.2: a private_key_jwt client; the audience is the token
      # endpoint as the worker names it.
      EACP_FAKEERP_OAUTH_KEY_CLIENT_ID: eacp-worker-pkjwt
      EACP_FAKEERP_OAUTH_KEY_AUDIENCE: http://fakeerp:8090/oauth/token
      EACP_FAKEERP_OAUTH_KEY_JWKS_FILE: /run/config/client-jwks/jwks.json
    secrets: [fakeerp_token, fakeerp_oauth_client]
    volumes:
      - fakeerp_data:/tmp
      - client_jwks:/run/config/client-jwks:ro
    depends_on:
      client-key: { condition: service_completed_successfully }
    networks: [erp]

  # The Slice C demo's MCP server (docs/DEMO.md). Only the worker reaches it,
  # with the token from its connector-secret manifest; the server holds just
  # its verifier. Its tools are read from /data/tools.json when present.
  fakemcp:
    build: { context: ., dockerfile: deployments/docker/Dockerfile }
    command: ["/fakemcp"]
    restart: on-failure
    environment:
      <<: *eacp-env
      EACP_HTTP_ADDR: ":8091"
      EACP_FAKEMCP_TOKEN_FILE: /run/secrets/fakemcp_token
      EACP_FAKEMCP_TOOLS_FILE: /data/tools.json
    secrets: [fakemcp_token]
    volumes:
      - fakemcp_data:/data
    networks: [erp]

  # Stand-in agent runtime used by the network-isolation test.
  agent:
    image: busybox:1.37
    command: ["sleep", "infinity"]
    networks: [agents]

networks:
  agents: {}
  core: {}
  erp:
    internal: true # no egress to the outside world either
  pdp:
    internal: true # the PDP needs no egress; ACS remote bundles are not used
  bus:
    internal: true # NATS needs no egress
  vault:
    internal: true # Vault needs no egress

volumes:
  pgdata: {}
  fakeerp_data: {}
  fakemcp_data: {}
  pdp_pki: {}
  nats_data: {}
  client_key: {}
  client_jwks: {}
  vault_approle: {}

secrets:
  connector_secrets:
    file: ./deployments/docker/secrets/connector-secrets.dev.json # local-development only
  fakeerp_token:
    file: ./deployments/docker/secrets/fakeerp-token.dev # generated locally; never committed
  fakemcp_token:
    file: ./deployments/docker/secrets/fakemcp-token.dev # generated locally; never committed
  fakeerp_oauth_client:
    file: ./deployments/docker/secrets/fakeerp-oauth-client.dev # generated locally; never committed
